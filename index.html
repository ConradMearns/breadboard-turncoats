<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turncoats</title>
    <script id="file-redirect">
      // When opened directly or served from repo root, redirect to the built output.
      // Skip on localhost so Vite dev still works.
      if (!location.pathname.includes('/docs/') && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        location.replace('docs/index.html');
      }
    </script>
  </head>
  <body style="width:100%;height:100%;margin:0;">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
